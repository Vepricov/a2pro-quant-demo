services:
  llm:
    image: vllm/vllm-openai:latest
    ports:
      - "${HOST_PORT:-8011}:8000"
    command:
      - --model
      - ${MODEL}                       # path to the quantized checkpoint (mounted)
      - --quantization
      - ${QUANTIZATION:-compressed-tensors}
      - --tensor-parallel-size
      - ${DEVICES_NUM:-1}
      - --gpu-memory-utilization
      - ${GPU_MEMORY:-0.9}
      - --max-model-len
      - ${MAX_MODEL_LEN:-4096}
      - --served-model-name
      - ${SERVED_NAME:-qwen-quant}
    volumes:
      - ${CHECKPOINTS_DIR:-../checkpoints}:/checkpoints   # quantized weights
      - ~/.cache/huggingface:/root/.cache/huggingface     # tokenizer/base cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    env_file:
      - .env
